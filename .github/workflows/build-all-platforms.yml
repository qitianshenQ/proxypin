# =============================================================================
# ProxyPin 全平台自动构建 v4（按第二轮真实 CI 日志修复）
#
# 放到 fork 仓库：.github/workflows/build-all-platforms.yml
#
# 日志来源：logs_120986769957.zip（run 44698021950，Flutter 3.47.9 / actions@v5）
# 结论：Windows / Linux / macOS / iOS 四个平台全部构建成功并上传产物；
#       仅 Android 仍 exit 1。
#
# [Android 唯一失败点]
#   Error: Your project's Gradle version (8.11.1) is lower than Flutter's
#          minimum supported version of 8.14.0. Please upgrade ...
#          Alternatively, use the flag "--android-skip-build-dependency-validation".
#   注意：3.47.9 也做这个校验（阈值 8.14.0），不只是 3.50.1（阈值 9.3.1）。
#   v3 用 `flutter build apk --help | grep` 探测该 flag —— 它是隐藏选项，
#   --help 里根本没有，导致 ANDROID_SKIP_FLAG 为空，绕过 flag 没加上。
#
# v4 修复：
#  1. 删掉 --help 探测，构建时**无条件先带** --android-skip-build-dependency-validation；
#     若当前 Flutter 不认识该选项，自动回退原生命令。
#  2. 若仍报 Gradle 版本过低，从报错里正则提取最低版本，自动改写
#     android/gradle/wrapper/gradle-wrapper.properties 的 distributionUrl 后重试。
#  3. 顺手 opt-out `android.newDsl`（日志里 Flutter Fix 的 AGP 9+ 提示）。
#  4. Linux 打包阶段第二轮出现「空 run 步骤 + 后续步骤全部消失」的异常：
#     把 Linux compatibility patches 的 Python heredoc 改成纯 bash（避免粘贴/解析
#     损坏），并把 Build Linux / tar.gz / DEB / Build meta 合并成一个步骤，
#     去掉跨步骤 .bundle_path 依赖，保证产物一定落盘。
#  5. 保留 v3 已验证有效的部分：Flutter 固定 3.47.9、windows-2022 +
#     coroutine 抑制宏、Linux -Werror 降级、CI 签名、Action v5、
#     Release 需五个平台全成功才发布。
#
# 默认 checkout 上游 wanghongenpin/proxypin 的 main；想编译自己 fork 的改动，
# 手动运行时把 source_repo 改成你的仓库、ref 改分支。
# 发布 Release 需 Settings -> Actions -> General -> Workflow permissions
#   -> Read and write permissions（本文件已声明 permissions: contents: write）。
# =============================================================================

name: ProxyPin 全平台构建

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库；留空 = 上游 wanghongenpin/proxypin（最新）'
        required: false
        default: ''
      ref:
        description: '分支 / tag / commit；留空 = 当前 ref'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter 版本；默认 3.47.9（v1.4.0 适配版）；填 stable = 最新 stable'
        required: false
        default: '3.47.9'
      publish_release:
        description: '是否额外发布到 GitHub Release（push v* tag 与定时任务会自动发布）'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag；留空自动生成 build-<run_number>'
        required: false
        default: ''
      sign_ios:
        description: '构建签名 IPA（需自备 IOS_* secrets 与 ios/ExportOptions.plist）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  schedule:
    # 每周一 UTC 02:00（北京时间 10:00）拉上游最新代码出一版
    - cron: '0 2 * * 1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ inputs.source_repo || 'wanghongenpin/proxypin' }}
  SOURCE_REF: ${{ inputs.ref || github.ref_name }}
  # 默认固定 3.47.9；手动填 stable 映射为空，由 flutter-action 按 channel 拉最新；
  # tag / schedule 等非 dispatch 事件 inputs 为空，也会走 3.47.9 兜底。
  FLUTTER_VERSION: ${{ (inputs.flutter_version == '' && '3.47.9') || (inputs.flutter_version == 'stable' && '') || inputs.flutter_version }}
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('build-{0}', github.run_number) }}

jobs:
  # ===========================================================================
  android:
    name: Android (APK / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK licenses & platform
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # 项目 android/app/build.gradle 的 release/debug 都绑 signingConfigs.release，
      # 且强制读 android/key.properties；CI 缺文件 -> validateSigningRelease 直接失败。
      - name: Prepare Android signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          JKS=android/release.jks
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$JKS"
          else
            rm -f "$JKS"
            keytool -genkey -v -keystore "$JKS" -alias proxypin-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass proxypin-ci -keypass proxypin-ci \
              -dname "CN=ProxyPin CI, OU=CI, O=ProxyPin, L=NA, S=NA, C=US" >/dev/null 2>&1
            STORE_PASSWORD=proxypin-ci
            KEY_PASSWORD=proxypin-ci
            KEY_ALIAS=proxypin-ci
            echo "::notice::未配置 ANDROID_* secrets，使用临时 CI 密钥"
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Disable R8 & opt-out AGP newDsl for CI
        shell: bash
        run: |
          F=android/app/build.gradle
          if [ -f "$F" ]; then
            sed -i 's/minifyEnabled true/minifyEnabled false/g; s/shrinkResources true/shrinkResources false/g' "$F"
          fi
          if [ -f android/gradle.properties ] && ! grep -q 'android.newDsl' android/gradle.properties; then
            printf '\nandroid.newDsl=false\n' >> android/gradle.properties
          fi
          echo "::notice::已关闭 R8 并 opt-out android.newDsl"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          git config --global url."https://github.com/".insteadOf "git@github.com:" || true
          flutter clean || true
          flutter --version
          for i in 1 2 3; do
            flutter pub get && break
            echo "::warning::pub get 第 $i 次失败，10s 后重试"
            sleep 10
          done
          flutter pub get
          if [ -f l10n.yaml ]; then
            flutter gen-l10n || echo "::warning::gen-l10n 失败，仓库已提交 app_localizations.dart，忽略"
          fi
          flutter doctor -v || true

      # 核心修复：不再用 --help 探测（该 flag 是隐藏选项，探测必然失败）。
      # 1) 先无条件带绕过 flag；2) 不认识就回退原生命令；
      # 3) 仍报 Gradle 版本过低则从报错提取最低版本，自动改 wrapper 再试。
      - name: Build APK & AAB
        shell: bash
        run: |
          set -e
          SKIP="--android-skip-build-dependency-validation"
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          run_flutter() {
            local log="$1"; shift
            echo ">>> flutter $*"
            flutter "$@" 2>&1 | tee "$log"
            return "${PIPESTATUS[0]}"
          }
          build_target() {
            local sub="$1" log="/tmp/proxypin_${sub}.log"
            local args=(build "$sub" --release "$SKIP")
            if run_flutter "$log" "${args[@]}"; then return 0; fi

            # 情形 A：当前 Flutter 不认识这个隐藏 flag（老 SDK），回退原生命令
            if grep -qiE "Could not find an option named|Unknown option|unrecognized option|not a known option|Unknown flag" "$log"; then
              echo "::warning::$SKIP 不被当前 Flutter 识别，回退原生命令"
              args=(build "$sub" --release)
              if run_flutter "$log" "${args[@]}"; then return 0; fi
            fi

            # 情形 B：最新日志仍报 Gradle 版本过低 -> 从报错提取最低版本，
            # 自动改写 wrapper 的 distributionUrl 后再试（官方 Potential fix）
            if grep -q "minimum supported version of" "$log"; then
              # 报错行同时含「项目当前版本」和「最低要求版本」，只取 of 之后那个；
              # 结尾要求数字，避免把句尾的点号吃进版本号。
              MIN=$(sed -n 's/.*minimum supported version of \([0-9][0-9.]*[0-9]\).*/\1/p' "$log" | head -1)
              if [ -n "$MIN" ] && [ -f "$WRAPPER" ]; then
                echo "::warning::自动把 Gradle wrapper 升级到 $MIN 后重试"
                sed -i -E "s#gradle-[0-9][0-9.]*-(bin|all)\.zip#gradle-${MIN}-\1.zip#" "$WRAPPER"
                grep distributionUrl "$WRAPPER" || true
                if run_flutter "$log" "${args[@]}"; then return 0; fi
              fi
            fi

            echo "::error::$sub 构建失败，日志尾部："
            tail -60 "$log"
            return 1
          }
          build_target apk || exit 1
          build_target appbundle || exit 1

      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          [ -f "$APK" ] || APK=$(find build -type f -name '*.apk' | head -1)
          [ -f "$AAB" ] || AAB=$(find build -type f -name '*.aab' | head -1)
          [ -n "$APK" ] && [ -f "$APK" ] && cp "$APK" "dist/proxypin-android-${APP_VERSION}.apk"
          [ -n "$AAB" ] && [ -f "$AAB" ] && cp "$AAB" "dist/proxypin-android-${APP_VERSION}.aab"
          echo "source_commit=$(git rev-parse HEAD)" > "dist/BUILD_INFO_android.txt"
          flutter --version >> "dist/BUILD_INFO_android.txt"
          ls -lh dist
          [ -f "dist/proxypin-android-${APP_VERSION}.apk" ] || { echo "::error::未找到 APK"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "===== flutter doctor ====="
          flutter doctor -v || true
          echo "===== gradle wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties || true
          echo "===== build logs ====="
          for f in /tmp/proxypin_apk.log /tmp/proxypin_appbundle.log; do
            [ -f "$f" ] && { echo "--- $f"; tail -60 "$f"; }
          done

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-android-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  ios:
    name: iOS (unsigned app / optional IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          flutter clean || true
          flutter --version
          for i in 1 2 3; do flutter pub get && break; sleep 10; done
          flutter pub get
          if [ -f l10n.yaml ]; then
            flutter gen-l10n || echo "::warning::gen-l10n 失败，忽略"
          fi

      - name: Build unsigned iOS app
        if: ${{ !inputs.sign_ios }}
        shell: bash
        run: |
          set -e
          flutter build ios --release --no-codesign
          APP=$(find build/ios -type d -name '*.app' -prune | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/proxypin-ios-${APP_VERSION}-unsigned.zip"

      # 正式 IPA 需自备 IOS_* secrets 与 ios/ExportOptions.plist；
      # 项目带 Network Extension，通常还需要 extension 专用描述文件。
      - name: Build signed IPA (optional)
        if: ${{ inputs.sign_ios }}
        shell: bash
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROVISION" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          flutter build ipa --release --export-options-plist ios/ExportOptions.plist
          mkdir -p dist
          cp build/ios/ipa/*.ipa "dist/proxypin-ios-${APP_VERSION}.ipa"

      - name: Build meta
        shell: bash
        run: |
          mkdir -p dist
          echo "source_commit=$(git rev-parse HEAD)" > "dist/BUILD_INFO_ios.txt"
          flutter --version >> "dist/BUILD_INFO_ios.txt"
          ls -lh dist

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: flutter doctor -v || true

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-ios-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  windows:
    name: Windows (ZIP + EXE installer)
    runs-on: windows-2022   # VS2022 / MSVC 14.3x，避开 14.51 的 coroutine C2338 硬错误
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line
          $V = (($line -replace '^version:\s*','').Trim() -replace "'",'' -replace '"','' -replace '\+.*$','').Trim()
          if (-not $V) { $V = '0.0.0' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$V"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$V"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 日志复核：gen-l10n 实际成功；Windows 真正失败点是 MSVC 14.51 把
      # <experimental/coroutine> 的废弃提升为 C2338（permission_handler_windows）。
      # 下面仍保留「gen-l10n 非致命」的通用加固，但不作为主修复。
      - name: Prepare
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop | Out-Null
          flutter clean 2>$null | Out-Null
          flutter --version
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            flutter pub get
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::pub get 第 $i 次失败，10s 后重试"
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { exit 1 }
          if (Test-Path l10n.yaml) {
            flutter gen-l10n
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::gen-l10n 失败，仓库已提交 app_localizations.dart，忽略"
            }
          }
          flutter doctor -v
          # 显式清零，避免 GitHub 的 pwsh 包装把上一条 doctor 的非 0 退出码带出去
          $global:LASTEXITCODE = 0

      - name: Windows compatibility patches
        shell: pwsh
        run: |
          # 1) runner 的 PUB_CACHE 指向 AppData\Local\Pub\Cache，但目录可能不存在，
          #    cargokit 的 resolve_symlinks.ps1 会 Get-Item 失败（日志中的报错）。
          $pub = Join-Path $env:USERPROFILE 'AppData\Local\Pub\Cache'
          New-Item -ItemType Directory -Force -Path $pub | Out-Null

          # 2) MSVC 14.4x+ 把 <experimental/coroutine> 废弃变成 C2338 静态断言，
          #    permission_handler_windows 仍引用该头；定义微软给出的抑制宏。
          #    add_definitions 放在顶层 CMakeLists，对所有插件子目录 target 生效。
          $cmake = 'windows/CMakeLists.txt'
          $text = Get-Content -Path $cmake -Raw
          if ($text -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
            $insert = 'add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
            # 逐行插入，不用正则：固定放在 cmake_minimum_required 之后，
            # add_definitions 才会对后面 add_subdirectory 里的插件 target 生效。
            $lines = @($text -split "`r?`n")
            $at = 0
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*cmake_minimum_required\s*\(') { $at = $i + 1; break }
            }
            $before = @()
            if ($at -gt 0) { $before = @($lines[0..($at - 1)]) }
            $after = @()
            if ($at -lt $lines.Count) { $after = @($lines[$at..($lines.Count - 1)]) }
            $out = @($before) + @($insert) + @($after)
            Set-Content -Path $cmake -Value ($out -join "`n") -Encoding utf8NoBOM
            Write-Host "::notice::已在 windows/CMakeLists.txt 第 $($at + 1) 行注入 coroutine 抑制宏"
          }

          # 3) 额外通过 CL 环境变量兜底（cl.exe 会读取），三保险
          Add-Content -Path $env:GITHUB_ENV -Value "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          $global:LASTEXITCODE = 0

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Windows 构建失败"; exit 1 }
          $global:LASTEXITCODE = 0

      # 主产物 ZIP 单独一步：用系统 bsdtar 打 zip，避开 Compress-Archive 的
      # 长路径 / 大目录 / 文件占用问题；失败则回退 Compress-Archive。
      - name: Package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $rel)) {
            $rel = (Get-ChildItem -Path build/windows -Directory -Recurse -Filter Release | Select-Object -First 1).FullName
          }
          if (-not $rel -or -not (Test-Path $rel)) { Write-Host "::error::未找到 Release 目录"; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist\proxypin-windows-$env:APP_VERSION.zip"
          tar -a -cf $zip -C $rel .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::bsdtar 失败，回退 Compress-Archive"
            Compress-Archive -Path "$rel\*" -DestinationPath $zip -Force
          }
          $global:LASTEXITCODE = 0
          Get-ChildItem dist | Format-Table -AutoSize

      # EXE 打包完全可失败降级：先探测预装 ISCC，再 choco，仍没有就只保留 ZIP。
      - name: Package EXE installer
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) {
            choco install innosetup -y --no-progress --limit-output
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          }
          if (-not $iscc) { Write-Host "::warning::Inno Setup 不可用，跳过 EXE，ZIP 仍会上传"; exit 0 }

          $rel = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $rel)) {
            $rel = (Get-ChildItem -Path build/windows -Directory -Recurse -Filter Release | Select-Object -First 1).FullName
          }
          $exe = (Get-ChildItem -Path $rel -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { Write-Host "::warning::未找到主 exe"; exit 0 }

          $iss = @(
            '[Setup]',
            'AppId={{502cbca5-a7f1-4f8f-894d-9820bac2e36f}',
            'AppName=ProxyPin',
            "AppVersion=$env:APP_VERSION",
            'AppPublisher=ProxyPin',
            'DefaultDirName={autopf64}\ProxyPin',
            'DefaultGroupName=ProxyPin',
            'OutputDir=dist',
            "OutputBaseFilename=proxypin-windows-$env:APP_VERSION",
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            '[Languages]',
            'Name: "english"; MessagesFile: "compiler:Default.isl"',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked',
            '[Files]',
            ('Source: "{0}\*"; DestDir: "{{app}}"; Flags: ignoreversion recursesubdirs createallsubdirs' -f $rel),
            '[Icons]',
            ('Name: "{{group}}\ProxyPin"; Filename: "{{app}}\{0}"' -f $exe),
            ('Name: "{{autodesktop}}\ProxyPin"; Filename: "{{app}}\{0}"; Tasks: desktopicon' -f $exe),
            '[Run]',
            ('Filename: "{{app}}\{0}"; Description: "{{cm:LaunchProgram,ProxyPin}}"; Flags: nowait postinstall skipifsilent' -f $exe)
          )
          $iss | Set-Content -Path installer.iss -Encoding utf8NoBOM
          & $iscc installer.iss
          $global:LASTEXITCODE = 0
          Get-ChildItem dist | Format-Table -AutoSize

      - name: Build meta
        shell: pwsh
        run: |
          "source_commit=$(git rev-parse HEAD)" | Out-File -FilePath dist/BUILD_INFO_windows.txt -Encoding utf8
          flutter --version | Out-File -FilePath dist/BUILD_INFO_windows.txt -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      - name: Diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          flutter doctor -v
          Get-ChildItem -Path build/windows -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            Select-Object -First 10 | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-windows-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  macos:
    name: macOS (ZIP + DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          flutter clean || true
          flutter --version
          for i in 1 2 3; do flutter pub get && break; sleep 10; done
          flutter pub get
          if [ -f l10n.yaml ]; then flutter gen-l10n || echo "::warning::gen-l10n 失败，忽略"; fi

      - name: Build + package macOS
        shell: bash
        run: |
          set -e
          flutter build macos --release
          APP=$(find build/macos/Build/Products/Release -type d -name '*.app' -prune | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          APPNAME=$(basename "$APP")
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/proxypin-macos-${APP_VERSION}.zip"
          brew install create-dmg >/dev/null 2>&1 || true
          create-dmg \
            --volname "ProxyPin ${APP_VERSION}" \
            --window-pos 200 120 --window-size 660 400 \
            --icon-size 100 --app-drop-link 480 190 \
            --icon "$APPNAME" 170 190 --hide-extension "$APPNAME" \
            "dist/proxypin-macos-${APP_VERSION}.dmg" "$APP" \
            || echo "::warning::DMG 生成失败，ZIP 产物仍可用"

      - name: Build meta
        shell: bash
        run: |
          mkdir -p dist
          echo "source_commit=$(git rev-parse HEAD)" > "dist/BUILD_INFO_macos.txt"
          flutter --version >> "dist/BUILD_INFO_macos.txt"
          ls -lh dist

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: flutter doctor -v || true

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-macos-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  linux:
    name: Linux (tar.gz + DEB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Install Linux build deps
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do sudo apt-get update -qq && break; sleep 5; done
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libzstd-dev libsecret-1-dev \
            libayatana-appindicator3-dev libssl-dev libstdc++-12-dev file
          echo "::notice::系统依赖安装完成"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          flutter config --enable-linux-desktop
          flutter clean || true
          flutter --version
          for i in 1 2 3; do flutter pub get && break; echo "::warning::pub get 第 $i 次失败"; sleep 10; done
          flutter pub get
          if [ -f l10n.yaml ]; then flutter gen-l10n || echo "::warning::gen-l10n 失败，忽略"; fi
          flutter doctor -v || true

      # Ubuntu 26.04 的 clang 把 app_indicator_new 标为 deprecated，Flutter Linux
      # 模板的 -Werror 会把它升级成硬错误。纯 bash 处理（不用 heredoc，避免
      # workflow 复制/解析时被破坏），显式跟随插件 symlink 目录。
      - name: Linux compatibility patches
        shell: bash
        run: |
          set -e
          FILES="$( { find linux -type f -name CMakeLists.txt 2>/dev/null || true; \
                     find -L linux/flutter/ephemeral/.plugin_symlinks -type f -name CMakeLists.txt 2>/dev/null || true; } | sort -u )"
          N=0
          for f in $FILES; do
            sed -i -E 's/-Werror($|[^[:alnum:]_=])/-Wno-error=deprecated-declarations\1/g' "$f" 2>/dev/null || true
            N=$((N+1))
          done
          echo "::notice::已处理 CMakeLists: $N"
          TRAY=linux/flutter/ephemeral/.plugin_symlinks/tray_manager/linux/tray_manager_plugin.cc
          if [ -f "$TRAY" ] && ! grep -q '_SILENCE_DEPRECATED' "$TRAY"; then
            sed -i '1i #pragma GCC diagnostic ignored "-Wdeprecated-declarations"' "$TRAY"
            sed -i '2i // _SILENCE_DEPRECATED' "$TRAY"
            echo "::notice::已给 tray_manager 注入 pragma"
          fi

      # 合并成一个步骤：构建 + tar.gz + DEB + 元信息一次做完，避免第二轮日志里
      # 「Package tar.gz 变成空 run、后续步骤整体消失」导致 Linux 产物没上传。
      - name: Build + package Linux
        shell: bash
        run: |
          set -e
          flutter build linux --release || { echo "::error::Linux 构建失败"; exit 1; }
          BUNDLE=build/linux/x64/release/bundle
          [ -d "$BUNDLE" ] || BUNDLE=$(find build/linux -type d -name bundle | head -1)
          [ -n "$BUNDLE" ] && [ -d "$BUNDLE" ] || { echo "::error::未找到 bundle 目录"; exit 1; }
          mkdir -p dist
          tar -czf "dist/proxypin-linux-${APP_VERSION}-x64.tar.gz" -C "$BUNDLE" .
          echo "::notice::tar.gz 完成"

          if BIN=$(find "$BUNDLE" -maxdepth 1 -type f -executable | head -1) && [ -n "$BIN" ]; then
            BINNAME=$(basename "$BIN")
            PKG=build/debpkg
            rm -rf "$PKG"
            mkdir -p "$PKG/DEBIAN" "$PKG/opt/proxypin" "$PKG/usr/bin" \
                     "$PKG/usr/share/applications" "$PKG/usr/share/icons/hicolor/256x256/apps"
            cp -a "$BUNDLE/." "$PKG/opt/proxypin/"
            ln -sf "/opt/proxypin/$BINNAME" "$PKG/usr/bin/proxypin"
            printf 'Package: proxypin\nVersion: %s\nSection: net\nPriority: optional\nArchitecture: amd64\nMaintainer: ProxyPin CI\nDescription: Open source HTTP(S) traffic capture tool (Flutter)\n' \
              "$APP_VERSION" > "$PKG/DEBIAN/control"
            printf '[Desktop Entry]\nType=Application\nName=ProxyPin\nExec=/opt/proxypin/%s\nIcon=proxypin\nCategories=Network;Development;\nTerminal=false\n' \
              "$BINNAME" > "$PKG/usr/share/applications/proxypin.desktop"
            if [ -f assets/icon.png ]; then
              cp assets/icon.png "$PKG/usr/share/icons/hicolor/256x256/apps/proxypin.png"
            fi
            if dpkg-deb --build "$PKG" "dist/proxypin-linux-${APP_VERSION}-amd64.deb"; then
              echo "::notice::DEB 完成"
            else
              echo "::warning::DEB 打包失败，tar.gz 仍可用"
            fi
          else
            echo "::warning::未找到可执行文件，跳过 DEB"
          fi

          echo "source_commit=$(git rev-parse HEAD)" > "dist/BUILD_INFO_linux.txt"
          flutter --version >> "dist/BUILD_INFO_linux.txt"
          ls -lh dist
          [ -f "dist/proxypin-linux-${APP_VERSION}-x64.tar.gz" ] || { echo "::error::tar.gz 缺失"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "===== flutter doctor ====="
          flutter doctor -v || true
          echo "===== pkg-config ====="
          pkg-config --exists gtk+-3.0 && echo "gtk+-3.0 OK" || echo "gtk+-3.0 MISSING"
          echo "===== dist ====="
          ls -lh dist 2>/dev/null || true

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-linux-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  release:
    name: Collect & Publish
    needs: [android, ios, windows, macos, linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - name: Write build info
        shell: bash
        run: |
          mkdir -p dist
          {
            echo "ProxyPin all-platform build"
            echo "source: ${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_REF }}"
            echo "workflow run: ${{ github.run_id }} / #${{ github.run_number }}"
            echo "built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "files:"
            ls -lh dist
          } > dist/BUILD_INFO.txt

      - name: Upload combined artifact
        uses: actions/upload-artifact@v5
        with:
          name: proxypin-all-${{ steps.ver.outputs.version }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30

      - name: Warn on partial build
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: echo "::warning::部分平台构建失败，跳过 Release 发布，仅上传合并 Artifact"

      - name: Publish GitHub Release
        # 五个平台必须全部成功才发版，避免再发「只有 iOS/macOS」的残缺 Release
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ProxyPin ${{ steps.ver.outputs.version }} · all platforms (build ${{ github.run_number }})
          body_path: dist/BUILD_INFO.txt
          prerelease: ${{ github.event_name == 'schedule' || inputs.publish_release == true }}
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.ipa
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.tar.gz
            dist/BUILD_INFO*.txt
