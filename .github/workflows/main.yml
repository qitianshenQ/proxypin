# =============================================================================
# ProxyPin 全平台自动构建 v3（按真实 CI 日志修复）
#
# 放到 fork 仓库：.github/workflows/build-all-platforms.yml
#
# 日志来源：logs_120964094780.zip（run #1，Flutter 3.50.1 + ubuntu-26.04 /
# windows-latest(VS18/MSVC14.51)）。iOS / macOS 成功，三个平台挂在同一层：
#
#  [Android] FAILURE: Your project's Gradle version (8.11.1) is lower than
#            Flutter's minimum supported version of 9.3.1
#            -> 3.50 新增的 flutter-gradle-plugin 校验；官方提供
#               --android-skip-build-dependency-validation 绕过。
#  [Windows] error C2338: <experimental/coroutine> deprecated by MSVC 14.51
#            (permission_handler_windows)，另有
#            Get-Item : Could not find item C:\Users\runneradmin\AppData
#  [Linux]   error: 'app_indicator_new' is deprecated [-Werror,-Wdeprecated-declarations]
#            (tray_manager)，Flutter Linux 模板的 -Werror 把新 clang 的
#            deprecated 警告提升为硬错误。
#
# v3 主修复：
#  1. 默认 Flutter 固定到 3.47.9（项目 v1.4.0 / 2026-10-29 发布时的 stable，
#     Dart 3.13.7），避开刚发布 3.50.1 的破坏性校验；inputs 可手动覆盖。
#  2. Android：自动探测并按需追加 --android-skip-build-dependency-validation，
#     即使手动填 3.50+ 也能构建；保留 CI 签名 / 关闭 R8 / 确定产物路径。
#  3. Windows：runner 换 windows-2022（VS2022 / MSVC14.3x 不会把
#     experimental/coroutine 报成 C2338），双保险注入官方抑制宏
#     _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS 到 CMake；
#     预创建 AppData\Local\Pub\Cache 消除 cargokit resolve_symlinks.ps1 报错。
#  4. Linux：把仓库与插件 CMakeLists 里的 -Werror 替换为
#     -Wno-error=deprecated-declarations，并给 tray_manager 源码加 pragma。
#  5. Release：五个平台全部成功才发版，避免再发「只有 iOS/macOS」的残缺包。
#  6. 保留 v2 的通用加固：pub get 重试、gen-l10n 非致命、bsdtar/Inno Setup
#     降级、DEB 允许失败、Action 升 v5、failure() 诊断日志。
#
# 默认 checkout 上游 wanghongenpin/proxypin 的 main，保证「最新源码」；
# 想编译自己 fork 的改动，手动运行时把 source_repo 改成你的仓库、ref 改分支。
#
# 发布 Release 需：Settings -> Actions -> General -> Workflow permissions
#   -> Read and write permissions（本文件已声明 permissions: contents: write）。
# =============================================================================

name: ProxyPin 全平台构建

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '源码仓库；留空 = 上游 wanghongenpin/proxypin（最新）'
        required: false
        default: ''
      ref:
        description: '分支 / tag / commit；留空 = 当前 ref'
        required: false
        default: ''
      flutter_version:
        description: 'Flutter 版本；默认 3.47.9（项目 1.4.0 适配版），填 stable 用最新'
        required: false
        default: '3.47.9'
      publish_release:
        description: '是否额外发布到 GitHub Release（push v* tag 与定时任务会自动发布）'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag；留空自动生成 build-<run_number>'
        required: false
        default: ''
      sign_ios:
        description: '构建签名 IPA（需自备 IOS_* secrets 与 ios/ExportOptions.plist）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  schedule:
    # 每周一 UTC 02:00（北京时间 10:00）拉上游最新代码出一版
    - cron: '0 2 * * 1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ inputs.source_repo || 'wanghongenpin/proxypin' }}
  SOURCE_REF: ${{ inputs.ref || github.ref_name }}
  # 非 workflow_dispatch（tag / schedule）时 inputs 为空，必须在这里兜底，
  # 固定到项目适配版本，避免刚发布的新 stable 引入破坏性校验。
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.9' }}
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('build-{0}', github.run_number) }}

jobs:
  # ===========================================================================
  android:
    name: Android (APK / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK licenses & platform
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # 项目 android/app/build.gradle 的 release/debug 都绑 signingConfigs.release，
      # 且强制读 android/key.properties；CI 缺文件 -> validateSigningRelease 直接失败。
      # 四个 secrets 必须齐全才用正式密钥，否则生成临时 CI 密钥（仅自测分发）。
      - name: Prepare Android signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          JKS=android/release.jks
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$JKS"
          else
            rm -f "$JKS"
            keytool -genkey -v -keystore "$JKS" -alias proxypin-ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass proxypin-ci -keypass proxypin-ci \
              -dname "CN=ProxyPin CI, OU=CI, O=ProxyPin, L=NA, S=NA, C=US" >/dev/null 2>&1
            STORE_PASSWORD=proxypin-ci
            KEY_PASSWORD=proxypin-ci
            KEY_ALIAS=proxypin-ci
            echo "::notice::未配置 ANDROID_* secrets，使用临时 CI 密钥；正式分发请配置 keystore"
          fi
          # Gradle 的 file() 相对 android/app 解析，../release.jks => android/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          cat android/key.properties | sed 's/storePassword=.*/storePassword=***/; s/keyPassword=.*/keyPassword=***/'

      # 项目默认开启 R8（minifyEnabled/shrinkResources），CI 里常因缺 keep rules
      # 直接构建失败。关闭混淆不影响功能，只增大体积；需要混淆可删掉本步骤。
      - name: Disable R8 for CI
        shell: bash
        run: |
          F=android/app/build.gradle
          if [ -f "$F" ]; then
            sed -i 's/minifyEnabled true/minifyEnabled false/g; s/shrinkResources true/shrinkResources false/g' "$F"
            echo "::notice::已关闭 minifyEnabled / shrinkResources"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          git config --global url."https://github.com/".insteadOf "git@github.com:" || true
          flutter clean || true
          flutter --version
          for i in 1 2 3; do
            flutter pub get && break
            echo "::warning::pub get 第 $i 次失败，10s 后重试"
            sleep 10
          done
          flutter pub get
          if [ -f l10n.yaml ]; then
            flutter gen-l10n || echo "::warning::gen-l10n 失败，仓库已提交 app_localizations.dart，忽略"
          fi
          flutter doctor -v || true

      - name: Android compatibility patch
        shell: bash
        run: |
          set -e
          # Flutter 3.50+ 新增「Gradle 最低 9.3.1」校验，项目 wrapper 是 8.11.1，
          # 日志实测 assembleRelease 会被 dev.flutter.flutter-gradle-plugin 直接拒绝。
          # 官方绕过 flag 只在 3.50+ 存在，老 SDK 不认识，所以先探测再决定是否追加。
          FLAG=""
          if flutter build apk --help 2>&1 | grep -q -- '--android-skip-build-dependency-validation'; then
            FLAG="--android-skip-build-dependency-validation"
            echo "::notice::检测到 Gradle 版本校验，构建自动追加 $FLAG"
          else
            echo "::notice::当前 Flutter 无 Gradle 版本校验，按原样构建"
          fi
          echo "ANDROID_SKIP_FLAG=$FLAG" >> "$GITHUB_ENV"

      - name: Build APK & AAB
        shell: bash
        run: |
          set -e
          # 3.50+ 下若绕过 flag 不被某个子命令接受，退回原生命令再试一次
          if ! flutter build apk --release $ANDROID_SKIP_FLAG; then
            if [ -n "$ANDROID_SKIP_FLAG" ]; then
              echo "::warning::带 Gradle 校验绕过 flag 的 APK 构建失败，尝试原生命令"
              flutter build apk --release || {
                echo "::error::APK 构建失败"
                find build -name '*.log' -o -name '*.txt' 2>/dev/null | head -20 | xargs -r tail -60
                exit 1
              }
            else
              echo "::error::APK 构建失败"
              exit 1
            fi
          fi
          if ! flutter build appbundle --release $ANDROID_SKIP_FLAG; then
            if [ -n "$ANDROID_SKIP_FLAG" ]; then
              echo "::warning::带 Gradle 校验绕过 flag 的 AAB 构建失败，尝试原生命令"
              flutter build appbundle --release || { echo "::error::AAB 构建失败"; exit 1; }
            else
              echo "::error::AAB 构建失败"
              exit 1
            fi
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          [ -f "$APK" ] || APK=$(find build -type f -name '*.apk' | head -1)
          [ -f "$AAB" ] || AAB=$(find build -type f -name '*.aab' | head -1)
          [ -n "$APK" ] && [ -f "$APK" ] && cp "$APK" "dist/proxypin-android-${APP_VERSION}.apk"
          [ -n "$AAB" ] && [ -f "$AAB" ] && cp "$AAB" "dist/proxypin-android-${APP_VERSION}.aab"
          echo "source_commit=$(git rev-parse HEAD)" > "dist/BUILD_INFO_android.txt"
          flutter --version >> "dist/BUILD_INFO_android.txt"
          ls -lh dist
          [ -f "dist/proxypin-android-${APP_VERSION}.apk" ] || { echo "::error::未找到 APK"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "===== flutter doctor ====="
          flutter doctor -v || true
          echo "===== pubspec git deps ====="
          grep -nE 'git:|ref:|url:' pubspec.yaml || true
          echo "===== gradle logs ====="
          find . -path '*/build/*' -name '*.log' 2>/dev/null | head -20 | xargs -r tail -80

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-android-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  ios:
    name: iOS (unsigned app / optional IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          flutter clean || true
          flutter --version
          for i in 1 2 3; do flutter pub get && break; sleep 10; done
          flutter pub get
          if [ -f l10n.yaml ]; then
            flutter gen-l10n || echo "::warning::gen-l10n 失败，忽略"
          fi

      - name: Build unsigned iOS app
        if: ${{ !inputs.sign_ios }}
        shell: bash
        run: |
          set -e
          flutter build ios --release --no-codesign
          APP=$(find build/ios -type d -name '*.app' -prune | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/proxypin-ios-${APP_VERSION}-unsigned.zip"

      # 正式 IPA 需自备 IOS_* secrets 与 ios/ExportOptions.plist；
      # 项目带 Network Extension，通常还需要 extension 专用描述文件。
      - name: Build signed IPA (optional)
        if: ${{ inputs.sign_ios }}
        shell: bash
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROVISION" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          flutter build ipa --release --export-options-plist ios/ExportOptions.plist
          mkdir -p dist
          cp build/ios/ipa/*.ipa "dist/proxypin-ios-${APP_VERSION}.ipa"

      - name: Build meta
        shell: bash
        run: |
          mkdir -p dist
          echo "source_commit=$(git rev-parse HEAD)" > "dist/BUILD_INFO_ios.txt"
          flutter --version >> "dist/BUILD_INFO_ios.txt"
          ls -lh dist

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: flutter doctor -v || true

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-ios-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  windows:
    name: Windows (ZIP + EXE installer)
    runs-on: windows-2022   # VS2022 / MSVC 14.3x，避开 14.51 的 coroutine C2338 硬错误
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line
          $V = (($line -replace '^version:\s*','').Trim() -replace "'",'' -replace '"','' -replace '\+.*$','').Trim()
          if (-not $V) { $V = '0.0.0' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$V"
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$V"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # 日志复核：gen-l10n 实际成功；Windows 真正失败点是 MSVC 14.51 把
      # <experimental/coroutine> 的废弃提升为 C2338（permission_handler_windows）。
      # 下面仍保留「gen-l10n 非致命」的通用加固，但不作为主修复。
      - name: Prepare
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop | Out-Null
          flutter clean 2>$null | Out-Null
          flutter --version
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            flutter pub get
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::pub get 第 $i 次失败，10s 后重试"
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { exit 1 }
          if (Test-Path l10n.yaml) {
            flutter gen-l10n
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::gen-l10n 失败，仓库已提交 app_localizations.dart，忽略"
            }
          }
          flutter doctor -v
          # 显式清零，避免 GitHub 的 pwsh 包装把上一条 doctor 的非 0 退出码带出去
          $global:LASTEXITCODE = 0

      - name: Windows compatibility patches
        shell: pwsh
        run: |
          # 1) runner 的 PUB_CACHE 指向 AppData\Local\Pub\Cache，但目录可能不存在，
          #    cargokit 的 resolve_symlinks.ps1 会 Get-Item 失败（日志中的报错）。
          $pub = Join-Path $env:USERPROFILE 'AppData\Local\Pub\Cache'
          New-Item -ItemType Directory -Force -Path $pub | Out-Null

          # 2) MSVC 14.4x+ 把 <experimental/coroutine> 废弃变成 C2338 静态断言，
          #    permission_handler_windows 仍引用该头；定义微软给出的抑制宏。
          #    add_definitions 放在顶层 CMakeLists，对所有插件子目录 target 生效。
          $cmake = 'windows/CMakeLists.txt'
          $text = Get-Content -Path $cmake -Raw
          if ($text -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
            $insert = "add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)"
            $patterns = @('(?m)^(project\([^\r\n]*\)\s*)$', '(?m)^(cmake_minimum_required\([^\r\n]*\)\s*)$')
            $patched = $text
            foreach ($pat in $patterns) {
              if ($patched -match $pat) {
                $rx = [regex]::new($pat)
                $patched = $rx.Replace($patched, "`$0`n$insert", 1)
                break
              }
            }
            if ($patched -eq $text) { $patched = $text + "`n$insert`n" }
            Set-Content -Path $cmake -Value $patched -Encoding utf8NoBOM
            Write-Host "::notice::已注入 _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          }

          # 3) 额外通过 CL 环境变量兜底（cl.exe 会读取），三保险
          Add-Content -Path $env:GITHUB_ENV -Value "CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          $global:LASTEXITCODE = 0

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Windows 构建失败"; exit 1 }
          $global:LASTEXITCODE = 0

      # 主产物 ZIP 单独一步：用系统 bsdtar 打 zip，避开 Compress-Archive 的
      # 长路径 / 大目录 / 文件占用问题；失败则回退 Compress-Archive。
      - name: Package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $rel)) {
            $rel = (Get-ChildItem -Path build/windows -Directory -Recurse -Filter Release | Select-Object -First 1).FullName
          }
          if (-not $rel -or -not (Test-Path $rel)) { Write-Host "::error::未找到 Release 目录"; exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist\proxypin-windows-$env:APP_VERSION.zip"
          tar -a -cf $zip -C $rel .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::bsdtar 失败，回退 Compress-Archive"
            Compress-Archive -Path "$rel\*" -DestinationPath $zip -Force
          }
          $global:LASTEXITCODE = 0
          Get-ChildItem dist | Format-Table -AutoSize

      # EXE 打包完全可失败降级：先探测预装 ISCC，再 choco，仍没有就只保留 ZIP。
      - name: Package EXE installer
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) {
            choco install innosetup -y --no-progress --limit-output
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
            if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          }
          if (-not $iscc) { Write-Host "::warning::Inno Setup 不可用，跳过 EXE，ZIP 仍会上传"; exit 0 }

          $rel = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $rel)) {
            $rel = (Get-ChildItem -Path build/windows -Directory -Recurse -Filter Release | Select-Object -First 1).FullName
          }
          $exe = (Get-ChildItem -Path $rel -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { Write-Host "::warning::未找到主 exe"; exit 0 }

          $iss = @(
            '[Setup]',
            'AppId={{502cbca5-a7f1-4f8f-894d-9820bac2e36f}',
            'AppName=ProxyPin',
            "AppVersion=$env:APP_VERSION",
            'AppPublisher=ProxyPin',
            'DefaultDirName={autopf64}\ProxyPin',
            'DefaultGroupName=ProxyPin',
            'OutputDir=dist',
            "OutputBaseFilename=proxypin-windows-$env:APP_VERSION",
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            '[Languages]',
            'Name: "english"; MessagesFile: "compiler:Default.isl"',
            '[Tasks]',
            'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked',
            '[Files]',
            ('Source: "{0}\*"; DestDir: "{{app}}"; Flags: ignoreversion recursesubdirs createallsubdirs' -f $rel),
            '[Icons]',
            ('Name: "{{group}}\ProxyPin"; Filename: "{{app}}\{0}"' -f $exe),
            ('Name: "{{autodesktop}}\ProxyPin"; Filename: "{{app}}\{0}"; Tasks: desktopicon' -f $exe),
            '[Run]',
            ('Filename: "{{app}}\{0}"; Description: "{{cm:LaunchProgram,ProxyPin}}"; Flags: nowait postinstall skipifsilent' -f $exe)
          )
          $iss | Set-Content -Path installer.iss -Encoding utf8NoBOM
          & $iscc installer.iss
          $global:LASTEXITCODE = 0
          Get-ChildItem dist | Format-Table -AutoSize

      - name: Build meta
        shell: pwsh
        run: |
          "source_commit=$(git rev-parse HEAD)" | Out-File -FilePath dist/BUILD_INFO_windows.txt -Encoding utf8
          flutter --version | Out-File -FilePath dist/BUILD_INFO_windows.txt -Append -Encoding utf8
          $global:LASTEXITCODE = 0

      - name: Diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          flutter doctor -v
          Get-ChildItem -Path build/windows -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            Select-Object -First 10 | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-windows-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  macos:
    name: macOS (ZIP + DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          flutter clean || true
          flutter --version
          for i in 1 2 3; do flutter pub get && break; sleep 10; done
          flutter pub get
          if [ -f l10n.yaml ]; then flutter gen-l10n || echo "::warning::gen-l10n 失败，忽略"; fi

      - name: Build + package macOS
        shell: bash
        run: |
          set -e
          flutter build macos --release
          APP=$(find build/macos/Build/Products/Release -type d -name '*.app' -prune | head -1)
          [ -n "$APP" ] || { echo "::error::未找到 .app"; exit 1; }
          APPNAME=$(basename "$APP")
          codesign --force --deep --sign - "$APP" 2>/dev/null || true
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/proxypin-macos-${APP_VERSION}.zip"
          brew install create-dmg >/dev/null 2>&1 || true
          create-dmg \
            --volname "ProxyPin ${APP_VERSION}" \
            --window-pos 200 120 --window-size 660 400 \
            --icon-size 100 --app-drop-link 480 190 \
            --icon "$APPNAME" 170 190 --hide-extension "$APPNAME" \
            "dist/proxypin-macos-${APP_VERSION}.dmg" "$APP" \
            || echo "::warning::DMG 生成失败，ZIP 产物仍可用"

      - name: Build meta
        shell: bash
        run: |
          mkdir -p dist
          echo "source_commit=$(git rev-parse HEAD)" > "dist/BUILD_INFO_macos.txt"
          flutter --version >> "dist/BUILD_INFO_macos.txt"
          ls -lh dist

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: flutter doctor -v || true

      - uses: actions/upload-artifact@v5
        with:
          name: proxypin-macos-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  linux:
    name: Linux (tar.gz + DEB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(grep -E '^version:' pubspec.yaml | head -1 | cut -d: -f2- | tr -d " '\"\r" | cut -d+ -f1)
          [ -n "$V" ] || V=0.0.0
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Install Linux build deps
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do sudo apt-get update -qq && break; sleep 5; done
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libzstd-dev libsecret-1-dev \
            libayatana-appindicator3-dev libssl-dev libstdc++-12-dev file
          echo "::notice::系统依赖安装完成"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Prepare
        shell: bash
        run: |
          set -e
          flutter config --enable-linux-desktop
          flutter clean || true
          flutter --version
          for i in 1 2 3; do flutter pub get && break; echo "::warning::pub get 第 $i 次失败"; sleep 10; done
          flutter pub get
          if [ -f l10n.yaml ]; then flutter gen-l10n || echo "::warning::gen-l10n 失败，忽略"; fi
          flutter doctor -v || true

      - name: Linux compatibility patches
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import pathlib, re
          # Ubuntu 26.04 的 clang 把 app_indicator_new 标记为 deprecated，
          # Flutter Linux 模板的 -Werror 把它升级成硬错误（日志中的失败点）。
          # 仓库文件 + pub get 生成的插件 symlink 一起处理，其他警告仍保留 -Wall。
          changed = 0
          seen = set()
          targets = list(pathlib.Path('linux').rglob('CMakeLists.txt'))
          sym_root = pathlib.Path('linux/flutter/ephemeral/.plugin_symlinks')
          if sym_root.exists():
              for link in sym_root.iterdir():
                  if link.is_dir():
                      targets.extend(link.rglob('CMakeLists.txt'))
          for f in targets:
              try:
                  rp = f.resolve()
                  if rp in seen:
                      continue
                  seen.add(rp)
                  t = f.read_text(errors='ignore')
                  t2 = re.sub(r'-Werror(?![\w=])', '-Wno-error=deprecated-declarations', t)
                  if t2 != t:
                      f.write_text(t2)
                      changed += 1
                      print('patched cmake:', f)
              except Exception as e:
                  print('skip cmake:', f, e)
          # 双保险：tray_manager 源码直接加 pragma，插件若自带 -Werror 也不怕
          sym = pathlib.Path('linux/flutter/ephemeral/.plugin_symlinks/tray_manager/linux')
          if sym.exists():
              for f in sym.rglob('*.cc'):
                  try:
                      t = f.read_text(errors='ignore')
                      if '_SILENCE_DEPRECATED' not in t:
                          f.write_text('#pragma GCC diagnostic ignored "-Wdeprecated-declarations"\n// _SILENCE_DEPRECATED\n' + t)
                          print('pragma:', f)
                  except Exception as e:
                      print('skip cc:', f, e)
          print('CMakeLists patched:', changed)
          PY

      - name: Build Linux
        shell: bash
        run: |
          set -e
          flutter build linux --release || {
            echo "::error::Linux 构建失败"
            find build/linux -name '*.log' 2>/dev/null | head -10 | xargs -r tail -80
            exit 1
          }
          BUNDLE=build/linux/x64/release/bundle
          [ -d "$BUNDLE" ] || BUNDLE=$(find build/linux -type d -name bundle | head -1)
          [ -n "$BUNDLE" ] && [ -d "$BUNDLE" ] || { echo "::error::未找到 bundle 目录"; exit 1; }
          echo "$BUNDLE" > .bundle_path
          ls -lh "$BUNDLE"

      # 主产物 tar.gz 先落盘；deb 打包独立且允许失败，不再拖垮整个 job。
      - name: Package tar.gz
        shell: bash
        run: |
 
